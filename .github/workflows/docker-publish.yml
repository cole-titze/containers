name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  # Weekly rebuild of every image, so base images and packages stay current
  # (the Dockerfiles use :latest bases). The cluster's nightly image updater rolls them out.
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2  # Ensures we have at least the last commit for comparison

      - name: Determine changed files
        id: changes
        run: |
          if [ "${{ github.event_name }}" != push ] && [ "${{ github.event_name }}" != pull_request ] || ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            for v in magic_mirror llm nfs monero qrl codespace; do echo "$v=1" >> $GITHUB_ENV; done
          else
            echo "magic_mirror=$(git diff --name-only HEAD~1 HEAD | grep '^magic-mirror/' | wc -l)" >> $GITHUB_ENV
            echo "llm=$(git diff --name-only HEAD~1 HEAD | grep '^llm-web-backend/' | wc -l)" >> $GITHUB_ENV
            echo "nfs=$(git diff --name-only HEAD~1 HEAD | grep '^nfs/' | wc -l)" >> $GITHUB_ENV
            echo "monero=$(git diff --name-only HEAD~1 HEAD | grep '^monero-miner/' | wc -l)" >> $GITHUB_ENV
            echo "qrl=$(git diff --name-only HEAD~1 HEAD | grep '^qrl-miner/' | wc -l)" >> $GITHUB_ENV
            echo "codespace=$(git diff --name-only HEAD~1 HEAD | grep '^code-space/' | wc -l)" >> $GITHUB_ENV
          fi

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU dependency
        uses: docker/setup-qemu-action@v4

      - name: Build and push Docker image for magic mirror
        if: env.magic_mirror != '0'
        uses: docker/build-push-action@v7
        with:
          context: ./magic-mirror
          file: ./magic-mirror/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/containers/magic-mirror:latest
          platforms: linux/arm64/v8

      - name: Build and push Docker image for llm
        if: env.llm != '0'
        uses: docker/build-push-action@v7
        with:
          context: ./llm-web-backend
          file: ./llm-web-backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/containers/llm-web-backend:latest
          platforms: linux/arm64/v8

      - name: Build and push Docker image for codespace
        if: env.codespace != '0'
        uses: docker/build-push-action@v7
        with:
          context: ./code-space
          file: ./code-space/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/containers/code-space:latest
          platforms: linux/arm64/v8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container  # Enables multi-platform builds

      - name: Build and push Docker image for monero-miner arm v8
        if: env.monero != '0'
        uses: docker/build-push-action@v7
        with:
          context: ./monero-miner
          file: ./monero-miner/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/containers/monero-miner:latest
          platforms: linux/amd64,linux/arm64/v8

      - name: Build and push Docker image for qrl-miner
        if: env.qrl != '0'
        uses: docker/build-push-action@v7
        with:
          context: ./qrl-miner
          file: ./qrl-miner/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/containers/qrl-miner:latest
          platforms: linux/amd64,linux/arm64/v8